<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pagina non trovata</title>
    <style>
       @font-face {
        font-family: "Outfit";
        src: url("/fonts/Outfit.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      html {
        scroll-behavior: smooth;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Outfit", sans-serif;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);

        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        transition: all 0.3s ease;
      }

      .not-found {
        width: 100%;
        margin-top: var(--top-appbar-height);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-height: 100vh;
        padding: 16px;
        box-sizing: border-box;
      }

      .not-found img {
        max-width: 500px;
        width: 100%;
        height: auto;
      }

      .overlay {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 48px;
      }

      p {
        margin: 0;
      }

      .home-button {
        display: inline-block;
        background-color: var(--color-primary);
        color: var(--color-on-primary);
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="not-found">
      <div class="overlay">
        <h1>404</h1>
        <p>La pagina che stai cercando non esiste.</p>
      </div>

      <img src="/images/404.webp" alt="404" />

      <a href="/" class="home-button">Torna alla home</a>
    </div>
  </body>
</html>
